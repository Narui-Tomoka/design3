<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>サガマリアージュ</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- ヘッダーからmain、footerまですべて入れる -->
    <div class="all-wrap">
      <!-- ヘッダー右側の部分 -->
      <header class="header">
        <!-- ↓flex -->
        <div class="header__menu">
          <!-- ↓flex -->
          <nav class="header__nav">
            <a class="header__nav__item" href="#">About us</a>
            <a class="header__nav__item" href="#">History</a>
            <a class="header__nav__item" href="#">Project</a>
            <a class="header__nav__item" href="#">Story</a>
          </nav>
          <!-- ↓flex -->
          <div class="header__sns">
            <a class="header__sns__item" href="#"
              ><i class="fa-brands fa-facebook"></i
            ></a>
            <a class="header__sns__item" href="#"
              ><i class="fa-brands fa-instagram"></i
            ></a>
          </div>
          <!-- ↓言語選択機能　使うタグなど要確認とりあえずdivタグにしている -->
          <div class="header__lang">
            <div class="header__lang__item">Language</div>
            <!-- <div class="header__lang__item">Select Language</div>
          <div class="header__lang__item">日本語</div>
          <div class="header__lang__item">English</div> -->
          </div>
        </div>
        <!-- 左側の3色のロゴがある部分 -->
        <nav class="fix-nav">
          <a class="fix-nav__icon" href="#">
            <img src="src/img/saga-mariage_logo2.png" alt="logo" />
          </a>
        </nav>
        <!-- ハンバーガーメニュー -->
        <div class="hamburger" id="js-hamburger">
          <!-- ↓CSSで3本線にする -->
          <span class="hamburger__border"></span>
          <span class="hamburger__border"></span>
          <span class="hamburger__border"></span>
        </div>
        <!-- ↓ここは時間があれば実装する部分
      <nav class="global-nav"></nav> -->
      </header>
      <main>
        <section class="main-visual">
          <!-- 文字の部分　後で実装
        <div class="main-visual__title"></div> -->
          <div class="main-visual__left">
            <!-- figureタグは図やイラストのまとまりを示すタグ -->
            <figure>
              <img src="" alt="" />
            </figure>
            <figure>
              <img src="" alt="" />
            </figure>
            <figure>
              <img src="" alt="" />
            </figure>
            <figure>
              <img src="" alt="" />
            </figure>
            <figure>
              <img src="" alt="" />
            </figure>
          </div>
          <div class="main-visual__right">
            <figure>
              <!-- leftと同じ構造にする -->
            </figure>
          </div>
        </section>
        <!-- ↓flex -->
        <section class="topics">
          <h2></h2>
          <!-- スライドショー部分　jsプラグインswiperを使って実装 -->
          <div class="swiper"></div>
          <!-- スクロールバーをカスタム -->
          <div class="swiper-scrollbar"></div>
        </section>
        <section class="concept"></section>
        <section class="about"></section>
        <section class="project"></section>
        <section class="story"></section>
        <section class="activity"></section>
      </main>
      <footer></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
